apiVersion: apps/v1
kind: Deployment

metadata:
  name: payments

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payments

  template:
    metadata:
      labels:
        app: payments

    spec:
      containers:
        - name: payments
          image: this-image-does-not-exist:v99

          ports:
            - containerPort: 80
